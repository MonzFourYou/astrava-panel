<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrava Panel</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        ASTRAVA
    </div>

    <ul>

        <li class="menu-item active">🏠 Dashboard</li>
        <li class="menu-item">🤖 Bot Manager</li>
        <li class="menu-item">👤 Owner</li>
        <li class="menu-item">👥 Users</li>
        <li class="menu-item">💬 Messages</li>
        <li class="menu-item">📦 Database</li>
        <li class="menu-item">📜 Activity</li>
        <li class="menu-item">⚙️ Settings</li>

    </ul>

</div>

<div class="content">

    <div class="topbar">

        <h1>Dashboard</h1>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <div class="cards">

        <div class="card">
            <h3>🤖 Bot Status</h3>
            <span>Online</span>
        </div>

        <div class="card">
            <h3>👤 Owner</h3>
            <span>Monz</span>
        </div>

        <div class="card">
            <h3>👥 Users</h3>
            <span>0</span>
        </div>

        <div class="card">
            <h3>📦 Database</h3>
            <span>Disconnected</span>
        </div>

        <div class="card">
            <h3>⚡ Version</h3>
            <span>v1.0.0</span>
        </div>

        <div class="card">
            <h3>💻 Server</h3>
            <span>Cloudflare</span>
        </div>

    </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/router.js"></script>

</body>
</html>
